name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip<26"
          pip install -r requirements.txt
      - name: Test
        env:
          EMBEDDING_BACKEND: hash
          DEEPSEEK_API_KEY: sk-test-not-real
          WEB_API_KEY: user-key-0123456789abcdef,second-user-key-0123456789
          WEB_ADMIN_API_KEY: admin-key-0123456789abc
          WEB_API_KEY_ROLES: user-key-0123456789abcdef=analyst,second-user-key-0123456789=analyst
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest tests -q
