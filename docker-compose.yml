version: '3.8'

services:
  # ========== Web 前端服务（新增） ==========
  web:
    build: .
    container_name: ai-data-web
    env_file: .env
    ports:
      # 只绑定宿主机回环地址。需要对局域网开放时再改成 "8080:8080"。
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config

  # ========== 飞书 Bot（长连接，只处理私聊） ==========
  feishu:
    build: .
    container_name: ai-data-feishu
    env_file: .env
    command: python -m channels.feishu
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config

  # ========== 钉钉 Bot 服务 ==========
  agent:
    build: .
    container_name: ai-data-agent
    env_file: .env
    command: python dingtalk_bot.py
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config

  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_DB: agent_experience
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env to a strong password of at least 12 characters}
    # 不把 5432 发布到宿主机。应用通过 compose 网络访问服务名 postgres。
    entrypoint: ["sh", "/usr/local/bin/require_strong_pg_password.sh"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 仅空数据卷会执行。已有 pg_data 时请按 scripts/MIGRATION.md 跑 migrate.sql。
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/require_strong_pg_password.sh:/usr/local/bin/require_strong_pg_password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_experience"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: agent-chromadb
    # 不把 8000 发布到宿主机。Chroma 无认证，只留在 compose 网络内。
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  pg_data:
  chroma_data:
